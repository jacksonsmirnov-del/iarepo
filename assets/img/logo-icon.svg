<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Network branches (from main node upward) -->
  <line x1="32" y1="22" x2="19" y2="12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="32" y1="22" x2="45" y2="12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Leaf nodes -->
  <circle cx="19" cy="11" r="3.5" fill="white" fill-opacity="0.72"/>
  <circle cx="45" cy="11" r="3.5" fill="white" fill-opacity="0.72"/>

  <!-- Main node — the dot of the "i" -->
  <circle cx="32" cy="22" r="5.5" fill="white"/>

  <!-- "i" stem -->
  <rect x="27" y="31" width="10" height="22" rx="5" fill="white"/>
</svg>
